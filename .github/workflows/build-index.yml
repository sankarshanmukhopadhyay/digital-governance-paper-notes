name: Build index

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: pip install pyyaml

      - name: Editorial lint
        run: python scripts/editorial_lint.py

      - name: Knowledge-layer lint
        run: python scripts/knowledge_lint.py

      - name: Build generated discovery site
        run: python scripts/build_site.py

      - name: Verify README generated summaries are committed
        run: |
          if ! git diff --exit-code -- README.md; then
            echo "::error::README.md generated summary blocks are stale. Run python scripts/build_index.py and commit README.md."
            exit 1
          fi

      - name: Verify generated review output is reproducible
        run: python scripts/build_site.py --check
