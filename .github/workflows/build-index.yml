name: Build index

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: pip install pyyaml

      - name: Editorial lint
        run: python scripts/editorial_lint.py

      - name: Knowledge-layer lint
        run: python scripts/knowledge_lint.py

      - name: Build generated discovery site
        run: python scripts/build_site.py

      - name: Verify generated review output is reproducible
        run: python scripts/build_site.py --check

      - name: Persist generated README summaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- README.md; then
            echo "README summaries are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(index): refresh generated README summaries [skip ci]"
          git push
