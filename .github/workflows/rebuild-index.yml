name: Rebuild Paper Review Index

on:
  push:
    branches:
      - main
    paths:
      - 'reviews/**/*.md'
      - 'taxonomy/domains.yml'
      - 'collections/collections.json'
      - 'scripts/build_index.py'
      - '.github/workflows/rebuild-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build static discovery site
        run: python scripts/build_index.py

      - name: Verify generated output
        run: python scripts/build_index.py --check

      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python scripts/build_index.py --print-generated | xargs git add --

          if git diff --cached --quiet; then
            echo "No generated files changed"
            exit 0
          fi

          git commit -m "Rebuild generated discovery site [skip ci]"
          git push
