name: Build index

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: pip install pyyaml

      - name: Editorial lint (Tier 1 checks)
        run: |
          python scripts/editorial_lint.py

      - name: Build generated discovery site
        run: |
          python scripts/build_index.py

      - name: Verify generated output is reproducible
        run: |
          python scripts/build_index.py --check
